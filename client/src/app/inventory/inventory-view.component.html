<div class="flex-row">
  <div class="flex-1">
    @if (inventory()) {
    <app-inventory-card [inventory]="inventory()"></app-inventory-card>
    } @else if (error().help !== '') {
    <mat-card class="error-card">
      <mat-card-content>
        <h2>
          {{ error().help }}
        </h2>
        <p>
          {{ error().message }}
        </p>
        <p>
          {{ error().httpResponse }}
        </p>
      </mat-card-content>
      <mat-card-actions>
        <button color="primary" mat-raised-button routerLink="/inventories">
          Back to Supplies List
        </button>
      </mat-card-actions>
    </mat-card>
    } @else {
    <mat-card>
      <mat-card-content>
        <p>Loading Inventory Profile data...</p>
      </mat-card-content>
    </mat-card>
    }
  </div>
</div>
